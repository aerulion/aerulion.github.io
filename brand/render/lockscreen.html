<!doctype html>
<meta charset="utf-8" />
<title>lockscreen</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html,
    body {
        background: #000;
    }
    body {
        width: 430px;
        height: 932px;
        overflow: hidden;
    }
    #stage {
        position: relative;
        width: 430px;
        height: 932px;
        background: #000;
    }
    svg {
        position: absolute;
        inset: 0;
        width: 430px;
        height: 932px;
    }
    .ray {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
    }
    .ink {
        fill: #fff;
    }
</style>
<div id="stage"><svg viewBox="0 0 430 932"><g id="art"></g></svg></div>
<script type="module">
    import {SILHOUETTE} from './morphing-logo.js';

    const NS = 'http://www.w3.org/2000/svg';
    const W = 430;
    const H = 932;
    const q = new URLSearchParams(location.search);

    /* Clear of the clock and the widget row above, and of the two controls
       below. Nothing else is on the ground, so both stay legible. */
    const CX = W / 2;
    const CY = Number(q.get('cy') ?? 508);
    const SIZE = Number(q.get('s') ?? 192);
    const BOX = 27.712813;
    const BLEED = 40;

    const art = document.getElementById('art');
    const el = (name, attrs, parent = art) => {
        const node = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
        parent.append(node);
        return node;
    };

    const at = (ux, uy) => [CX + (ux - BOX / 2) * (SIZE / BOX), CY + (uy - BOX / 2) * (SIZE / BOX)];
    const APEX = at(13.856406, 0);
    const RIGHT = at(25.856406, 20.78461);
    const TAIL = at(13.856406, 27.712813);
    const LEFT = at(1.856406, 20.78461);

    /* Each outer edge of the mark, carried on past the figure and off the
       plate. Only downward: the clock and the widget row sit on the top half
       and nothing is drawn under them. Every ray runs off an edge, so no crop
       can sever a frame. */
    const ray = ([ax, ay], [bx, by]) => {
        const len = Math.hypot(bx - ax, by - ay);
        const dx = (bx - ax) / len;
        const dy = (by - ay) / len;
        let far = 0;
        for (const [reach, step, from] of [
            [-BLEED, dx, bx],
            [W + BLEED, dx, bx],
            [H + BLEED, dy, by]
        ]) {
            if (Math.abs(step) < 1e-9) continue;
            const t = (reach - from) / step;
            if (t > far) far = t;
        }
        el('path', {
            class: 'ray',
            d: `M${bx.toFixed(2)} ${by.toFixed(2)} ${(bx + dx * far).toFixed(2)} ${(by + dy * far).toFixed(2)}`
        });
    };

    for (const [a, b] of [
        [APEX, RIGHT],
        [APEX, LEFT],
        [RIGHT, TAIL],
        [LEFT, TAIL]
    ]) {
        ray(a, b);
    }

    const mark = el('svg', {
        viewBox: `0 0 ${BOX} ${BOX}`,
        x: CX - SIZE / 2,
        y: CY - SIZE / 2,
        width: SIZE,
        height: SIZE
    });
    el('path', {class: 'ink', d: SILHOUETTE}, mark);

    window.render = () => {};
    document.documentElement.dataset.ready = '1';
</script>
