<!doctype html>
<meta charset="utf-8" />
<title>icon</title>
<style>
    html,
    body {
        margin: 0;
        padding: 0;
        background: #000;
    }
    #stage {
        width: 100vw;
        height: 100vh;
        display: block;
    }
    #stage svg {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
<div id="stage"><svg id="mark" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script type="module">
    import {SILHOUETTE} from './morphing-logo.js';

    const q = new URLSearchParams(location.search);
    const box = Number(q.get('box') ?? 0.86);
    const fg = q.get('fg') ?? '#fff';
    const bg = q.get('bg') ?? '#000';

    const VIEW = 2 * 24 / Math.sqrt(3);
    const span = VIEW / box;
    const pad = (span - VIEW) / 2;

    document.body.style.background = bg;
    const svg = document.getElementById('mark');
    svg.setAttribute('viewBox', `${-pad} ${-pad} ${span} ${span}`);

    const ground = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ground.setAttribute('fill', bg);
    ground.setAttribute('d', `M${-pad} ${-pad}h${span}v${span}h${-span}z`);
    svg.append(ground);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', fg);
    path.setAttribute('d', SILHOUETTE);
    svg.append(path);

    document.documentElement.dataset.ready = 'true';
</script>
