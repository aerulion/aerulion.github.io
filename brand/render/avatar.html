<!doctype html>
<meta charset="utf-8" />
<title>avatar</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html,
    body {
        background: #000;
    }
    body {
        width: 128px;
        height: 128px;
        overflow: hidden;
    }
    #stage {
        position: relative;
        width: 128px;
        height: 128px;
        background: #000;
    }
    svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
    }
    .mark-ink {
        fill: #fff;
    }
    .mark-outline {
        fill: none;
        stroke: #fff;
        stroke-width: 0.76;
        stroke-linejoin: miter;
    }
    .mark-shell,
    .mark-ladder {
        fill: none;
        stroke: #fff;
        stroke-width: 0.3;
        stroke-linejoin: miter;
        opacity: 0;
    }
</style>
<div id="stage">
    <svg viewBox="-8.4013 -8.4013 44.5154 44.5154">
        <defs>
            <clipPath id="clip"><path class="mark-clip" /></clipPath>
            <clipPath id="bare"><path class="mark-bare" clip-rule="evenodd" /></clipPath>
        </defs>
        <g class="mark-depth">
            <path class="mark-ladder" />
            <path class="mark-shell" />
            <path class="mark-shell" />
            <path class="mark-shell" />
            <path class="mark-shell" />
        </g>
        <g clip-path="url(#bare)"><g clip-path="url(#clip)"><path class="mark-outline" /></g></g>
        <g clip-path="url(#clip)"><polygon class="mark-ink" /></g>
    </svg>
</div>
<script type="module">
    import {barePath, episodeBeat, inkPoints, INK_TRAVEL, ladderPath, toPath, unfold} from './morphing-logo.js';

    const LOOP = 7;
    const LEAD = 0.7;
    const SHELL_ALPHA = 0.34;
    const SHELL_FADE = 0.5;
    const LADDER_ALPHA = 0.11;
    const OPTIONS = {depth: 0.4, shells: 2, precess: -1, anomaly: 0.14, phase: 0, fan: 0};

    // Two same-direction arcs close the 4D rotation on a full turn, so the last
    // frame lands exactly on the first: the loop has no seam.
    const episode = {
        rest: 0.5,
        span: 5.1,
        arcs: [
            {
                fan: 0.42,
                phase: 1.9,
                reach: 1.05,
                dir: 1,
                peak: Math.PI / 2 + 0.1,
                out: {strike: 0.5, hold: 1.0, ease: 'snap'},
                back: {strike: 0.45, hold: 0.4, ease: 'recoil'}
            },
            {
                fan: 2.65,
                phase: 4.35,
                reach: 0.95,
                dir: 1,
                peak: Math.PI / 2 - 0.12,
                out: {strike: 0.55, hold: 1.1, ease: 'recoil'},
                back: {strike: 0.45, hold: 0.65, ease: 'glide'}
            }
        ]
    };

    const svg = document.querySelector('svg');
    const pick = (sel) => svg.querySelector(sel);
    const shells = svg.querySelectorAll('.mark-shell');
    pick('.mark-ink').setAttribute('points', inkPoints());

    window.render = (t) => {
        const beat = episodeBeat(episode, t * LOOP, LEAD);
        const frame = unfold(beat.angle, {
            ...OPTIONS,
            phase: beat.phase,
            fan: beat.fan,
            depth: OPTIONS.depth * beat.reach
        });

        const d = toPath(frame.base);
        pick('.mark-outline').setAttribute('d', d);
        pick('.mark-clip').setAttribute('d', d);

        const dy = beat.ink * INK_TRAVEL;
        pick('.mark-bare').setAttribute('d', barePath(dy));
        pick('.mark-ink').style.transform = `translateY(${dy.toFixed(4)}px)`;

        pick('.mark-ladder').setAttribute('d', ladderPath(frame));
        pick('.mark-ladder').style.opacity = String(frame.spread * LADDER_ALPHA);

        frame.shells.forEach((shell, i) => {
            const node = shells[i];
            node.setAttribute('d', d);
            node.setAttribute('transform', `translate(${shell.offset[0].toFixed(3)} ${shell.offset[1].toFixed(3)})`);
            node.style.opacity = String(frame.spread * SHELL_ALPHA * (1 - shell.level * SHELL_FADE));
        });
    };

    window.render(Number(new URLSearchParams(location.search).get('t') ?? 0));

    document.documentElement.dataset.ready = '1';
</script>
